[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "contabil-core"
version = "0.1.0"
description = "Backend do sistema contábil — substituto do MrContador"
requires-python = ">=3.12"
dependencies = [
    # ── Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # ── Banco
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # ── Auth / Segurança
    "python-jose[cryptography]>=3.3",
    "signxml>=4.0",
    "bcrypt>=4.1",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",

    # ── Redis
    "redis>=5.0",

    # ── Logging
    "structlog>=24.1",

    # ── Exportação
    "openpyxl>=3.1",

    # ── PDF
    "pdfplumber>=0.11",
    "pymupdf>=1.24",            # renderização de páginas PDF como imagem (Vision fallback)

    # ── CONCILPRO — conciliação de fornecedores
    "psycopg2-binary>=2.9",    # sessão síncrona para background tasks pesados
    "python-Levenshtein>=0.23",
    "openai>=1.30",             # GPT-4o-mini (texto) + GPT-4o Vision para parsing de PDF
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # TestClient assíncrono
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-passlib",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # FastAPI usa Depends() em assinaturas

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["src/db/migrations/*"]
