version: "3.9"

services:
  # ── Aplicação
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://contabil:contabil@db:5432/contabil_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-minimo-32-caracteres-aqui
      - ENVIRONMENT=development
      - DEBUG=true
      - COOKIE_SECURE=false
      - ALLOWED_ORIGINS=http://localhost:4200,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app     # hot reload em dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-config null

  # ── PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contabil
      POSTGRES_PASSWORD: contabil
      POSTGRES_DB: contabil_dev
    ports:
      - "5435:5432"   # host:5435 → container:5432 (porta padrão do PostgreSQL)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabil -d contabil_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── pgAdmin (dev only)
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@contabil.local
      PGADMIN_DEFAULT_PASSWORD: dev
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
