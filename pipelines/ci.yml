name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Ruff (format)
        run: ruff format --check src/ tests/

      - name: Mypy (type check)
        run: mypy src/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]" aiosqlite

      - name: Run unit tests
        env:
          SECRET_KEY: "ci-test-secret-key-minimo-32-caracteres"
          DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x"  # não usado em unit tests
        run: pytest tests/unit/ tests/smoke/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contabil
          POSTGRES_PASSWORD: contabil
          POSTGRES_DB: contabil_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run integration tests
        env:
          SECRET_KEY: "ci-test-secret-key-minimo-32-caracteres"
          DATABASE_URL: "postgresql+asyncpg://contabil:contabil@localhost:5432/contabil_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://contabil:contabil@localhost:5432/contabil_test"
        run: pytest tests/integration/ -v
